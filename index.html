<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Parts Used Scanner: tap Add part, scan one barcode, send the list by email (Google Apps Script) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parts Used</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --white:#ffffff; --black:#0a0c10;
    --grey-50:#f4f6f9; --grey-100:#e9edf2; --grey-200:#d3d9e1; --grey-400:#6b7480; --grey-700:#3a414c;
    --navy:#12325e; --navy-2:#1a4480; --blue-mid:#3f7fc4; --sky:#7cc4f5; --red:#b3261e;
    --grad-blue:linear-gradient(120deg,var(--navy),var(--blue-mid));
    --glow-sky:0 6px 22px -6px rgba(63,127,196,.55);
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  html{-webkit-text-size-adjust:100%}
  body{overscroll-behavior-x:none;margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--white);color:var(--black)}
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));overflow-x:clip}
  h1{font-size:1.3rem;margin:4px 0 14px;color:var(--black)}
  .label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey-400);margin:16px 0 6px;font-weight:600}
  button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

  .field{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--grey-200);border-radius:10px;background:var(--white);color:var(--black)}
  .field::placeholder{color:var(--grey-400)}
  .upper{text-transform:uppercase}
  .upper::placeholder{text-transform:none}

  .add{width:100%;margin-top:14px;font:inherit;font-size:1.1rem;font-weight:700;border:0;border-radius:16px;padding:18px;cursor:pointer;
    color:var(--white);background:var(--grad-blue);box-shadow:var(--glow-sky)}
  .add.stop{background:var(--grey-700);box-shadow:none}

  .viewer{position:relative;width:100%;margin-top:12px;background:var(--black);border-radius:12px;overflow:hidden;min-height:200px;display:grid;place-items:center}
  .viewer[hidden]{display:none}
  #video{width:100%;max-width:100%;display:none}
  #reader{width:100%;max-width:100%;overflow:hidden} #reader *{max-width:100%!important} #reader video{width:100%!important;height:auto!important;display:block}
  .guide{position:absolute;left:5%;right:5%;top:32%;bottom:32%;border:3px solid var(--sky);border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.4);display:none;pointer-events:none}
  .guide::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--sky);opacity:.7}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button.b{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;flex:1 1 120px;text-align:center;min-width:0}
  button.b:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:var(--navy-2);color:var(--white)}
  .secondary{background:var(--grey-700);color:var(--white)}
  .ghost{background:var(--white);color:var(--grey-700);border:1px solid var(--grey-200)!important}
  .manual{display:flex;gap:8px;margin-top:10px}
  .manual .field{flex:1;min-width:0}
  .manual button{flex:0 0 80px}
  .status{overflow-wrap:anywhere;font-size:.88rem;color:var(--grey-400);margin:10px 2px;min-height:1.2em}
  .status.err{color:var(--red)} .status.ok{color:var(--navy-2);font-weight:600}

  .card{background:var(--white);border:1px solid var(--grey-200);border-radius:12px;overflow:hidden}
  .card header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--navy);color:var(--white)}
  .card header b{font-size:1rem}
  .card header span{font-size:.85rem;color:var(--sky)}
  .entry{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--grey-100)}
  .entry:last-child{border-bottom:0}
  .entry.fresh{background:var(--grey-50);box-shadow:inset 4px 0 0 var(--sky)}
  .sn{flex:1;min-width:0;font-weight:700;font-size:1.05rem;word-break:break-all;letter-spacing:.02em}
  .empty{padding:18px 12px;color:var(--grey-400);font-size:.92rem;text-align:center}
  .qty{display:flex;align-items:center;gap:4px}
  .qty b{min-width:30px;text-align:center;font-size:1rem}
  .ib{font:inherit;font-weight:700;width:36px;height:36px;border-radius:8px;border:1px solid var(--grey-200);background:var(--grey-50);color:var(--grey-700);cursor:pointer;padding:0}
  .ib.x{color:var(--red);margin-left:4px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .label{margin-top:4px}
  .beep{display:block;margin:14px 2px;font-size:.9rem;color:var(--grey-400)}
  #filereader{display:none}

  /* Success check flash */
  .ok-flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50;
    background:rgba(255,255,255,.55);opacity:0;visibility:hidden;transition:opacity 220ms ease,visibility 0s 220ms}
  .ok-flash.show{opacity:1;visibility:visible;transition:opacity 120ms ease}
  .ok-flash svg{width:min(52vmin,260px);height:min(52vmin,260px);display:block;will-change:transform}
  .ok-ring{fill:none;stroke:var(--blue-mid);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:120px 120px}
  .ok-halo{fill:none;stroke:var(--blue-mid);stroke-width:2;opacity:0;transform-origin:120px 120px}
  .ok-core{fill:var(--navy)}
  .ok-tick{fill:none;stroke:var(--white);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}

  @media (max-width:380px){button.b{font-size:.92rem;padding:12px 8px} .wrap{padding-left:12px;padding-right:12px}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Parts Used</h1>

  <div class="grid2">
    <div><div class="label">Technician</div>
      <input class="field" id="tech" placeholder="Your name" autocomplete="name" autocapitalize="words"></div>
    <div><div class="label">Work order</div>
      <input class="field upper" id="wo" placeholder="Optional" autocomplete="off" autocapitalize="characters"></div>
  </div>

  <button class="add" id="add">+ Add part</button>

  <div class="viewer" id="viewer" hidden>
    <video id="video" playsinline muted></video>
    <div id="reader"></div>
    <div class="guide" id="guide"></div>
  </div>

  <div class="manual">
    <input class="field upper" id="manualIn" placeholder="Or type the part number" autocomplete="off" autocapitalize="characters">
    <button class="b ghost" id="manualAdd">Add</button>
  </div>
  <div class="status" id="status" role="status"></div>

  <div class="label">Parts used</div>
  <div class="card" id="list"></div>

  <div class="row">
    <button class="b primary" id="save">Send for reorder</button>
    <button class="b ghost" id="clear">Clear</button>
  </div>
  <label class="beep"><input type="checkbox" id="beep" checked> Beep on scan</label>

  <div id="filereader"></div>
</div>

<div class="ok-flash" id="okFlash" aria-hidden="true">
  <svg id="okSvg" viewBox="0 0 240 240">
    <circle class="ok-halo" id="okHalo" cx="120" cy="120" r="62"></circle>
    <circle class="ok-core" cx="120" cy="120" r="60"></circle>
    <circle class="ok-ring" id="okRing" cx="120" cy="120" r="60" stroke-dasharray="377" stroke-dashoffset="377"></circle>
    <path class="ok-tick" id="okTick" d="M92 122 L112 143 L152 99" stroke-dasharray="92" stroke-dashoffset="92"></path>
  </svg>
</div>

<script>
/* ---------- Setup: paste your Apps Script web app URL here ---------- */
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby-_wQa49nP0wk-1qBLwZiyOlwfaPZnXAeQRDxWSisL7yvB7hlIFdNseSVBqUUGbJE/exec";

const $=id=>document.getElementById(id);
const status=(msg,kind)=>{const s=$("status");s.textContent=msg||"";s.className="status"+(kind?" "+kind:"");};

/* ---------- Device storage (safe if blocked) ---------- */
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};

/* ---------- Parts list (draft survives a page reload) ---------- */
let parts=[], fresh="";
try{const d=JSON.parse(store.get("pu.draft")||"null"); if(d){parts=d.parts||[]; $("wo").value=d.wo||"";}}catch(e){}
const persist=()=>store.set("pu.draft",JSON.stringify({wo:$("wo").value,parts}));
$("wo").oninput=persist;
$("tech").value=store.get("pu.tech")||"";
$("tech").oninput=()=>store.set("pu.tech",$("tech").value.trim());

function render(){
  const list=$("list"); list.replaceChildren();
  const total=parts.reduce((n,p)=>n+p.qty,0);
  const head=document.createElement("header");
  head.innerHTML=`<b>Scanned parts</b><span>${parts.length} part${parts.length===1?"":"s"} · ${total} pcs</span>`;
  list.appendChild(head);
  if(!parts.length){
    const e=document.createElement("div"); e.className="empty"; e.textContent="No parts yet. Tap Add part to scan one.";
    list.appendChild(e);
  }
  parts.forEach((p,i)=>{
    const r=document.createElement("div"); r.className="entry"+(p.pn===fresh?" fresh":"");
    r.innerHTML=`<span class="sn"></span><div class="qty">
      <button class="ib" aria-label="Less">−</button><b></b><button class="ib" aria-label="More">+</button>
      <button class="ib x" aria-label="Remove">×</button></div>`;
    r.querySelector(".sn").textContent=p.pn;
    r.querySelector(".qty b").textContent=p.qty;
    const [minus,plus,del]=r.querySelectorAll("button");
    minus.onclick=()=>{ if(p.qty>1){p.qty--; render();} };
    plus.onclick=()=>{ p.qty++; render(); };
    del.onclick=()=>{ parts.splice(i,1); render(); };
    list.appendChild(r);
  });
  $("save").disabled=!parts.length;
  persist();
}

/* ---------- Add a part (one scan per tap) ---------- */
function clean(t){return String(t).trim().replace(/^\*|\*$/g,"").toUpperCase();}
function addPart(raw){
  const pn=clean(raw); if(!pn) return;
  const hit=parts.find(p=>p.pn===pn);
  if(hit) hit.qty++; else parts.push({pn,qty:1});
  fresh=pn;
  if(navigator.vibrate) navigator.vibrate(60); beep(); flashSuccess();
  status(hit?`${pn} — quantity now ${hit.qty}`:`Added ${pn}`,"ok");
  render();
}
function beep(){ if(!$("beep").checked) return;
  try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();
  o.frequency.value=1800;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},90);}catch(e){} }

/* ---------- Success check flash ---------- */
const flashSuccess=(()=>{
  const wrap=$("okFlash"), svg=$("okSvg"), ring=$("okRing"), tick=$("okTick"), halo=$("okHalo");
  const RING=377, TICK=92, DUR=1180, HOLD=250;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const spring=t=>t>=1?1:1+Math.pow(2,-7*t)*Math.sin((t*7-0.18)*Math.PI*2)*0.42;
  const easeOut=t=>1-Math.pow(1-t,3);
  let raf=0, hideT=0;
  return function(){
    cancelAnimationFrame(raf); clearTimeout(hideT);
    wrap.classList.add("show");
    if(reduce){ ring.style.strokeDashoffset=0; tick.style.strokeDashoffset=0; svg.style.transform="scale(1)";
      hideT=setTimeout(()=>wrap.classList.remove("show"),700); return; }
    ring.style.strokeDashoffset=RING; tick.style.strokeDashoffset=TICK; halo.style.opacity=0;
    const t0=performance.now();
    const frame=now=>{
      const ms=Math.min(DUR,now-t0);
      ring.style.strokeDashoffset=RING*(1-(ms<520?easeOut(ms/520):1));
      svg.style.transform=`scale(${spring(Math.min(1,ms/620)).toFixed(4)})`;
      tick.style.strokeDashoffset=TICK*(1-(ms<360?0:ms>760?1:easeOut((ms-360)/400)));
      if(ms>620){const h=(ms-620)/(DUR-620); halo.style.opacity=(0.5*(1-h)).toFixed(3); halo.style.transform=`scale(${(1+h*0.9).toFixed(3)})`;}
      else halo.style.opacity=0;
      if(ms<DUR) raf=requestAnimationFrame(frame);
      else { halo.style.opacity=0; hideT=setTimeout(()=>wrap.classList.remove("show"),HOLD); }
    };
    raf=requestAnimationFrame(frame);
  };
})();

/* ---------- Scan engines ---------- */
let detector=null;
const WANT=["code_39","code_128","code_93","qr_code","data_matrix","itf"];
const nativeReady=(async()=>{
  if(!("BarcodeDetector" in window)) return;
  try{const sup=await BarcodeDetector.getSupportedFormats();const f=WANT.filter(x=>sup.includes(x));
      if(f.includes("code_39")) detector=new BarcodeDetector({formats:f});}catch(e){}
})();
const F=window.Html5QrcodeSupportedFormats;
const libCfg={formatsToSupport:F?[F.CODE_39,F.CODE_128,F.CODE_93,F.QR_CODE,F.DATA_MATRIX,F.ITF]:[],verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
let camLib=null;
function lib(){ if(!window.Html5Qrcode) throw new Error("Scanner library failed to load");
  camLib??=new Html5Qrcode("reader",libCfg); }

// Camera reads must match twice in a row (Code 39 has no check digit), then the camera closes.
let armed=false, pending={text:"",n:0,t:0};
function cameraHit(raw){
  if(!armed) return;
  const text=clean(raw), now=Date.now();
  if(pending.text===text && now-pending.t<1500) pending.n++; else pending={text,n:1,t:now};
  pending.t=now;
  if(pending.n>=2){ armed=false; pending={text:"",n:0,t:0}; addPart(text); stop(); }
}

/* ---------- Camera ---------- */
let running=false,mode=null,stream=null,loop=null,busy=false;
const HIRES={facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:"continuous"}]};
async function start(){
  armed=true; pending={text:"",n:0,t:0};
  $("viewer").hidden=false; $("add").textContent="Cancel scan"; $("add").classList.add("stop");
  status("Starting camera…"); await nativeReady;
  try{
    if(detector){
      stream=await navigator.mediaDevices.getUserMedia({video:HIRES,audio:false});
      const v=$("video"); v.srcObject=stream; v.style.display="block"; await v.play();
      $("guide").style.display="block"; mode="native";
      loop=setInterval(async()=>{ if(!armed||busy||v.readyState<2) return; busy=true;
        try{const r=await detector.detect(v); if(r.length) cameraHit(r[0].rawValue);}catch(e){} busy=false; },100);
    }else{
      lib();
      await camLib.start({facingMode:"environment"},
        {fps:15,videoConstraints:HIRES,qrbox:(w,h)=>({width:Math.floor(w*.94),height:Math.max(80,Math.floor(h*.4))})},
        t=>cameraHit(t),()=>{});
      mode="lib";
    }
    running=true;
    requestAnimationFrame(()=>$("viewer").scrollIntoView({behavior:"smooth",block:"center"}));
    status("Hold the phone sideways, 4–8 inches away, barcode level across the line.");
  }catch(e){
    await stop();
    status("Camera unavailable ("+(e?.message||e)+"). Allow camera access, or type the part number.","err");
  }
}
async function stop(){
  armed=false; clearInterval(loop); loop=null;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  if(mode==="lib"){try{await camLib.stop();}catch(e){}}
  $("video").style.display="none"; $("guide").style.display="none"; $("viewer").hidden=true;
  running=false; mode=null; $("add").textContent="+ Add part"; $("add").classList.remove("stop");
}
$("add").onclick=()=>{ if(running||armed){ stop(); status(""); } else start(); };

/* ---------- Manual entry ---------- */
function addManual(){const v=$("manualIn").value; if(!v.trim()) return; addPart(v); $("manualIn").value="";}
$("manualAdd").onclick=addManual;
$("manualIn").onkeydown=e=>{if(e.key==="Enter") addManual();};

/* ---------- Clear ---------- */
$("clear").onclick=()=>{ if(!parts.length&&!$("wo").value) return;
  if(!confirm("Clear the parts list and work order?")) return;
  parts=[]; fresh=""; $("wo").value=""; status(""); render(); };

/* ---------- Send (email + sheet via Apps Script) ---------- */
async function sendParts(){
  if(!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL)) throw new Error("Sending isn't set up yet (no web app URL in the page).");
  const tech=$("tech").value.trim();
  if(!tech){ $("tech").focus(); throw new Error("Enter your name first."); }
  const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({tech,wo:$("wo").value.trim().toUpperCase(),parts})});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok||!j||!j.ok) throw new Error(j&&j.error?j.error:`Server error ${r.status}`);
}
$("save").onclick=async()=>{
  if(!parts.length) return;
  if(!navigator.onLine){ status("No signal. Your list is kept on this phone; tap Send again when you're back online.","err"); return; }
  const btn=$("save"); btn.disabled=true; btn.textContent="Sending…"; status("Sending…");
  try{
    if(running) await stop();
    await sendParts();
    flashSuccess();
    const n=parts.length;
    status(`Sent ${n} part${n===1?"":"s"} for reorder. List cleared.`,"ok");
    parts=[]; fresh=""; $("wo").value=""; render();
  }catch(e){
    status((e&&e.message?e.message:String(e))+" Your list is kept on this phone.","err");
  }finally{
    btn.textContent="Send for reorder"; btn.disabled=!parts.length;
  }
};

render();
</script>
</body>
</html>
